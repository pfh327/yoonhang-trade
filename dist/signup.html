<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 · 윤항무역 마케팅 파트너</title><link rel="stylesheet" href="auth.css"></head><body><div class="auth-shell"><section class="brand-panel"><div class="brand">윤항무역<small>MARKETING PARTNER</small></div><div class="brand-copy"><div class="eyebrow">TEAM ACCESS</div><h1>함께 고객을 찾고<br>거래를 키웁니다.</h1><p>직원 정보를 등록하면 윤항무역 마케팅 작업 공간에 참여할 수 있습니다.</p><div class="feature-row"><span class="feature">직원별 작업</span><span class="feature">고객 정보 보호</span><span class="feature">관리자 승인</span></div></div><div style="color:#708795;font-size:11px">Yoonhang Trade · Seoul / Yiwu</div></section><section class="form-panel"><div class="form-card"><h2>회원가입</h2><p class="lead">직원 계정을 신청해 주세요.</p><div id="notice" class="notice"></div><form id="signupForm"><div class="field"><label for="signupName">이름</label><input id="signupName" autocomplete="name" placeholder="홍길동"></div><div class="field"><label for="signupEmail">이메일</label><input id="signupEmail" type="email" autocomplete="email" placeholder="name@company.com"></div><div class="field"><label for="signupPhone">휴대폰 번호</label><input id="signupPhone" type="tel" autocomplete="tel" placeholder="010-0000-0000"></div><div class="field"><label for="signupId">아이디</label><input id="signupId" autocomplete="username" placeholder="영문·숫자 조합"></div><div class="field"><label for="signupPw">비밀번호</label><input id="signupPw" type="password" autocomplete="new-password" placeholder="8자 이상"></div><div class="field"><label for="signupPwConfirm">비밀번호 확인</label><input id="signupPwConfirm" type="password" autocomplete="new-password" placeholder="비밀번호를 다시 입력하세요"></div><label class="check-row"><input id="signupTerms" type="checkbox"> <span>윤항무역 마케팅 업무용 계정으로 등록하는 데 동의합니다.</span></label><button class="primary" type="submit">가입 신청</button></form><div class="form-links"><a href="login.html">로그인으로 돌아가기</a></div><p class="legal">가입 신청 후 관리자 확인을 거쳐 사용합니다.<br>휴대폰 인증번호 발송은 Supabase 연결 단계에서 활성화합니다.</p></div></section></div><script src="auth.js"></script></body></html>
