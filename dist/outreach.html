<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연락 관리 · 윤항무역</title><link rel="stylesheet" href="pages.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">윤항무역<span>MARKETING PARTNER</span></div><nav class="nav"><a href="index.html" data-nav>⌂ 오늘의 대시보드</a><a href="leads.html" data-nav>◎ 고객 발굴</a><a class="active" href="outreach.html" data-nav>↗ 연락 관리</a><a href="inbox.html" data-nav>◌ 댓글·문의</a><a href="analytics.html" data-nav>⌁ 방문 분석</a><a href="settings.html" data-nav>⚙ 연결 설정</a></nav></aside><main class="main"><div class="eyebrow">OUTREACH DESK</div><h1 class="title">연락하고, 답변을 놓치지 않습니다.</h1><p class="sub">전화·문자·이메일·방문 기록을 고객별로 남기고 다음 행동을 정합니다.</p><div class="toolbar"><button class="btn primary">＋ 연락 기록</button><button class="btn">오늘 할 일</button><button class="btn">답변 없는 고객</button></div><div class="card"><table class="table"><thead><tr><th>고객</th><th>최근 연락</th><th>방법</th><th>상태</th><th>다음 연락</th></tr></thead><tbody id="outreachRows"><tr><td colspan="5" class="muted">아직 연락을 완료한 고객이 없습니다.</td></tr></tbody></table></div></main></div><script src="app.js"></script><script>(function(){const rows=document.querySelector('#outreachRows');let leads=JSON.parse(localStorage.getItem('yhtrade.leads')||'[]');const contacted=leads.filter(function(x){return x.lastContactAt});function render(){if(!contacted.length){rows.innerHTML='<tr><td colspan="5" class="muted">아직 연락을 완료한 고객이 없습니다.</td></tr>';return}rows.innerHTML=contacted.sort(function(a,b){return String(b.lastContactAt).localeCompare(String(a.lastContactAt))}).map(function(x){const d=new Date(x.lastContactAt).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});const m=(x.log||'').split(' | ').pop().replace(' 작성','')||'연락';const status=x.responseStatus||'답변 대기';return '<tr><td><b>'+String(x.name||'')+'</b><br><span class="muted">'+String(x.interest||'')+'</span></td><td>'+d+'</td><td>'+m+'</td><td><span class="badge">'+status+'</span><br><button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="메일 회신">메일 회신</button> <button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="문자 회신">문자 회신</button> <button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="전화 응답">전화 응답</button></td><td>후속 확인</td></tr>'}).join('');document.querySelectorAll('.response-btn').forEach(function(b){b.onclick=function(){const lead=leads.find(function(x){return x.name===b.dataset.name});if(lead){lead.responseStatus=b.dataset.status;lead.responseAt=new Date().toISOString();localStorage.setItem('yhtrade.leads',JSON.stringify(leads));location.reload()}}})}render()})();</script></body></html>
