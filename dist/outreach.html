order-color:#f0a18f}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">윤항무역<span>MARKETING PARTNER</span></div><nav class="nav"><a href="index.html" data-nav>⌂ 오늘의 대시보드</a><a href="leads.html" data-nav>◎ 고객 발굴</a><a class="active" href="outreach.html" data-nav>↗ 연락 관리</a><a href="inbox.html" data-nav>◌ 댓글·문의</a><a href="analytics.html" data-nav>⌁ 방문 분석</a><a href="settings.html" data-nav>⚙ 연결 설정</a></nav></aside><main class="main"><div class="eyebrow">OUTREACH DESK</div><h1 class="title">연락하고, 답변을 놓치지 않습니다. <span class="muted" id="outreachSummary"></span></h1><p class="sub">전화·문자·이메일·방문 기록을 고객별로 남기고 다음 행동을 정합니다.</p><div class="toolbar"><button class="btn primary">＋ 연락 기록</button><button class="btn">오늘 할 일</button><button class="btn">답변 없는 고객</button><div class="search-wrap"><span class="search-icon">⌕</span><input class="lead-search" id="outreachSearch" type="search" placeholder="업체명·전화번호·이메일·품목 검색"></div></div><div class="card"><table class="table"><thead><tr><th>고객</th><th>최근 연락</th><th>방법</th><th>상태</th><th>다음 연락</th></tr></thead><tbody id="outreachRows"><tr><td colspan="5" class="muted">아직 연락을 완료한 고객이 없습니다.</td></tr></tbody></table></div></main></div><script src="app.js"></script><script>(function(){const rows=document.querySelector('#outreachRows');let leads=JSON.parse(localStorage.getItem('yhtrade.leads')||'[]');const todayNew=[{"date":"2026-10-21","name":"새로나아동복","email":"","phone":"010-6443-2599"},{"date":"2026-10-21","name":"슬로그(SLOG)","email":"","phone":"010-8780-0823"},{"date":"2026-10-21","name":"오즈브릿지(OZBRIDGE)","email":"","phone":"010-4896-9951"},{"date":"2026-10-21","name":"키즈빌리지","email":"","phone":"010-8113-2213"},{"date":"2026-10-21","name":"블랙빈아동복","email":"","phone":"010-6316-8732"},{"date":"2026-10-21","name":"루아르드 메종","email":"mischnburber@naver.com","phone":"010-8282-5243"},{"date":"2026-10-21","name":"퍼니공장","email":"fnstore@naver.com","phone":"010-9013-4623"},{"date":"2026-10-21","name":"마이도매","email":"etn2015@naver.com","phone":"010-2680-6988"},{"date":"2026-10-21","name":"디비케이(DBK)","email":"eye0307@hanmail.net","phone":"010-4465-8522"},{"date":"2026-10-21","name":"신성어패럴","email":"","phone":"010-7708-2360"}];todayNew.forEach(function(seed){let item=leads.find(function(x){return String(x.name||'').trim()===seed.name});if(!item){item=Object.assign({},seed);leads.push(item)}item.date=seed.date;item.email=seed.email||item.email||'';item.phone=seed.phone||item.phone||'';item.smsWritten=true;item.contactActivityConfirmed=true;item.status='연락 완료(작성)';item.next='후속 확인';item.lastContactAt=item.lastContactAt||new Date().toISOString();item.log=item.log||'전화·문자 연락 완료';if(['루아르드 메종','퍼니공장','마이도매','디비케이(DBK)'].indexOf(seed.name)>=0){item.mailWritten=true;item.log=item.log+' | 메일 발송 완료'}});const unmanagedNames=['디오트','이랑패턴','장안쌤플'];leads.forEach(function(x){if(unmanagedNames.indexOf(String(x.name||'').trim())>=0){x.contactActivityConfirmed=false;return}if(x.contactActivityConfirmed!==true){x.contactActivityConfirmed=true;x.status=x.status||'연락 완료(작성)';x.next='후속 확인';x.lastContactAt=x.lastContactAt||new Date().toISOString()}});const todayNames=['새로나아동복','슬로그(SLOG)','오즈브릿지(OZBRIDGE)','키즈빌리지','블랙빈아동복','루아르드 메종','퍼니공장','마이도매','디비케이(DBK)','신성어패럴'];if(!localStorage.getItem('yhtrade.outreachDatesV1')){leads.forEach(function(x){if(todayNames.indexOf(String(x.name||'').trim())<0&&String(x.lastContactAt||'').slice(0,10)==='2026-10-21')x.lastContactAt='2026-10-20T09:00:00+09:00'});localStorage.setItem('yhtrade.outreachDatesV1','1')};const savedContacts=JSON.parse(localStorage.getItem('yhtrade.contacts')||'{}');let migrated=false;if(!localStorage.getItem('yhtrade.replyResetV3')){const lead=leads.find(function(x){return String(x.name||'').trim()==='마스터베어'});if(lead){delete lead.responseStatus;delete lead.responseNote;delete lead.responseAt}localStorage.setItem('yhtrade.replyResetV3','1');localStorage.setItem('yhtrade.leads',JSON.stringify(leads));}if(!localStorage.getItem('yhtrade.replyResetV2')){['동대문양말','현지패션'].forEach(function(name){const lead=leads.find(function(x){return String(x.name||'').trim()===name});if(lead){delete lead.responseStatus;delete lead.responseNote;delete lead.responseAt}});const nammin=leads.find(function(x){return String(x.name||'').trim()==='남민우 재고유통·물류'});if(nammin){nammin.responseStatus='문자 회신';nammin.responseNote=nammin.responseNote||'스포츠브랜드유통사업, 골프엑세서리, 양말, 파우치, 타월, 스포츠가방 로고제작 가능한 OEM상품, 스포츠가방 및 소품 확인';nammin.responseAt=nammin.responseAt||new Date().toISOString()}localStorage.setItem('yhtrade.replyResetV2','1');localStorage.setItem('yhtrade.leads',JSON.stringify(leads));}if(!localStorage.getItem('yhtrade.replyResetV1')){['Anna(안나)','ANGLAN(앵글런)','남민우 재고유통·물류','㈜클로어'].forEach(function(name){const lead=leads.find(function(x){return String(x.name||'').trim()===name});if(lead){delete lead.responseStatus;delete lead.responseNote;delete lead.responseAt}});localStorage.setItem('yhtrade.replyResetV1','1');localStorage.setItem('yhtrade.leads',JSON.stringify(leads));}leads.forEach(function(x){if(x.smsPrepared&&!x.smsWritten){x.smsWritten=true;migrated=true}const saved=savedContacts[x.name]||{};if(saved.lastChannel==='문자 작성'){x.smsWritten=true}if(saved.lastChannel==='메일 작성'){x.mailWritten=true}if(String(x.name||'').trim()==='남민우 재고유통·물류'&&x.responseNote&&x.responseStatus==='메일 회신'){x.responseStatus='문자 회신';migrated=true}if(String(x.name||'').trim()==='Anna(안나)'&&!x.smsWritten){x.smsWritten=true;x.contactActivityConfirmed=true;x.status='연락 완료(작성)';x.next='후속 확인';if(!x.lastContactAt||Number.isNaN(Date.parse(x.lastContactAt)))x.lastContactAt=new Date().toISOString();migrated=true}if((x.smsWritten||x.mailWritten)&&!x.contactActivityConfirmed){x.contactActivityConfirmed=true;x.status='연락 완료(작성)';x.next='후속 확인';x.lastContactAt=saved.lastContactAt||new Date().toISOString();migrated=true}if(x.contactActivityConfirmed&&(!x.lastContactAt||Number.isNaN(Date.parse(x.lastContactAt)))){const savedDate=Date.parse(saved.lastContactAt||'');x.lastContactAt=Number.isNaN(savedDate)?new Date().toISOString():saved.lastContactAt;migrated=true}});if(migrated)localStorage.setItem('yhtrade.leads',JSON.stringify(leads));const confirmedNames=['현지패션','URT(로뎀나무아래서)','남대문까운사','엔디엠(NDM)'];const today=new Date().toISOString().slice(0,10);leads.forEach(function(x){const tel=String(x.phone||'').replace(/\\s/g,'');if(String(x.date||'').slice(0,10)===today && /^010[-]?\\d{4}[-]?\\d{4}$/.test(tel) && !x.smsWritten && !x.smsNotNeeded){delete x.contactActivityConfirmed;delete x.lastContactAt;x.status='연락 대기';x.next='문자 발송'}});leads.forEach(function(x){if(confirmedNames.indexOf(x.name)>=0){x.mailWritten=true;x.smsNotNeeded=true;x.contactActivityConfirmed=true;if(!x.lastContactAt)x.lastContactAt=new Date().toISOString();if(!x.log)x.log='메일 작성 | 문자 불가 확인';}});localStorage.setItem('yhtrade.leads',JSON.stringify(leads));if(!localStorage.getItem('yhtrade.outreachDatesV2')){leads.forEach(function(x){if(todayNames.indexOf(String(x.name||'').trim())<0&&String(x.lastContactAt||'').slice(0,10)==='2026-10-21')x.lastContactAt='2026-10-20T09:00:00+09:00'});localStorage.setItem('yhtrade.outreachDatesV2','1');localStorage.setItem('yhtrade.leads',JSON.stringify(leads))};const contacted=leads.filter(function(x){return x.contactActivityConfirmed===true});function render(){document.querySelector('#outreachSummary').textContent='('+contacted.length+'곳 / 전체 '+contacted.length+'곳)';if(!contacted.length){rows.innerHTML='<tr><td colspan="5" class="muted">아직 연락을 완료한 고객이 없습니다.</td></tr>';return}const q=(document.querySelector('#outreachSearch').value||'').trim().toLowerCase();const visible=contacted.filter(function(x){const text=[x.name,x.email,x.phone,x.interest,x.log,x.responseStatus].join(' ').toLowerCase();return !q||text.indexOf(q)>=0});rows.innerHTML=visible.sort(function(a,b){return String(b.lastContactAt).localeCompare(String(a.lastContactAt))}).map(function(x,i){const parsedDate=Date.parse(x.lastContactAt||'');const d=(Number.isNaN(parsedDate)?new Date():new Date(parsedDate)).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});const contact=savedContacts[x.name]||{};const tel=String(contact.phone||x.phone||'').replace(/\\s/g,'');const mail=String(contact.email||x.email||'').trim();const isMobile=/^010[-]?\\d{4}[-]?\\d{4}$/.test(tel);const smsDone=x.smsWritten||x.smsPrepared||contact.lastChannel==='문자 작성';const mailDone=x.mailWritten||contact.lastChannel==='메일 작성';const smsLabel=smsDone?'문자 완료':(isMobile?'문자 대기':'문자 불가');const m=(mailDone?'메일 완료':(x.mailNotNeeded||!mail?'메일 불가':'메일 대기'))+' · '+smsLabel;const status=x.responseStatus||'답변 대기';const statusClass=status==='문자 회신'?'reply-sms':(status==='메일 회신'?'reply-mail':(status==='전화 응답'?'reply-phone':''));const responseDone=Boolean(x.responseStatus);const replyLabel=responseDone?'회신 완료':'답변 대기';const replyClass=responseDone?statusClass:'';const note=x.responseNote?'<br><span class="muted">'+String(x.responseNote).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})+'</span>':'';return '<tr><td><span class="seq">'+(i+1)+'</span><b>'+String(x.name||'')+'</b><br><span class="muted">'+String(x.interest||'')+'</span></td><td>'+d+'</td><td>'+m+'</td><td><span class="badge '+replyClass+'">'+replyLabel+'</span>'+note+'<br><button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="메일 회신">메일 회신</button> <button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="문자 회신">문자 회신</button> <button class="btn sms-reply-btn" data-name="'+String(x.name||'')+'">문자 답변 작성</button> <button class="btn mail-reply-btn" data-name="'+String(x.name||'')+'">메일 답변 작성</button></td><td>후속 확인<br><button class="btn reopen-btn" data-name="'+String(x.name||'')+'">고객 발굴로 되돌리기</button></td></tr>'}).join('');document.querySelectorAll('.response-btn').forEach(function(b){b.onclick=function(){const lead=leads.find(function(x){return x.name===b.dataset.name});if(lead){if(b.dataset.status==='문자 회신'||b.dataset.status ument.querySelectorAll('.reopen-btn').forEach(function(b){b.onclick=function(){const lead=leads.find(function(x){return x.name===b.dataset.name});if(lead){lead.contactActivityConfirmed=false;lead.status='연락 대기';lead.next='재발굴 검토';delete lead.lastContactAt;delete lead.responseStatus;delete lead.responseNote;delete lead.responseAt;localStorage.setItem('yhtrade.leads',JSON.stringify(leads));location.reload()}}})}document.querySelector('#outreachSearch').oninput=render;async function syncOutlookReplies(){try{const r=await fetch('http://127.0.0.1:8766/replies',{cache:'no-store'});if(!r.ok)return;const data=await r.json();let changed=false;(data.replies||[]).forEach(function(reply){const sender=String(reply.sender||'').toLowerCase();const lead=leads.find(function(x){return sender&&String(x.email||'').toLowerCase()===sender});if(lead){const note=[reply.subject||'',reply.body||''].filter(Boolean).join('\n\n');if(lead.responseStatus!=='메일 회신'||(note&&lead.responseNote!==note)){lead.responseStatus='메일 회신';lead.responseAt=reply.received;lead.responseNote=note;changed=true}}});if(changed){localStorage.setItem('yhtrade.leads',JSON.stringify(leads));render()}}catch(e){}}syncOutlookReplies();setInterval(syncOutlookReplies,300000);render()})();</script></body></html>
