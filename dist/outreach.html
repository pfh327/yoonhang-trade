<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연락 관리 · 윤항무역</title><link rel="stylesheet" href="pages.css"><style>.seq{display:inline-flex;min-width:24px;height:24px;align-items:center;justify-content:center;margin-right:6px;border-radius:999px;background:#eef6fb;color:#38536b;font-size:12px}.lead-search{min-width:260px}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">윤항무역<span>MARKETING PARTNER</span></div><nav class="nav"><a href="index.html" data-nav>⌂ 오늘의 대시보드</a><a href="leads.html" data-nav>◎ 고객 발굴</a><a class="active" href="outreach.html" data-nav>↗ 연락 관리</a><a href="inbox.html" data-nav>◌ 댓글·문의</a><a href="analytics.html" data-nav>⌁ 방문 분석</a><a href="settings.html" data-nav>⚙ 연결 설정</a></nav></aside><main class="main"><div class="eyebrow">OUTREACH DESK</div><h1 class="title">연락하고, 답변을 놓치지 않습니다. <span class="muted" id="outreachSummary"></span></h1><p class="sub">전화·문자·이메일·방문 기록을 고객별로 남기고 다음 행동을 정합니다.</p><div class="toolbar"><button class="btn primary">＋ 연락 기록</button><button class="btn">오늘 할 일</button><button class="btn">답변 없는 고객</button><input class="lead-search" id="outreachSearch" type="search" placeholder="업체명·품목·연락방법 검색"></div><div class="card"><table class="table"><thead><tr><th>고객</th><th>최근 연락</th><th>방법</th><th>상태</th><th>다음 연락</th></tr></thead><tbody id="outreachRows"><tr><td colspan="5" class="muted">아직 연락을 완료한 고객이 없습니다.</td></tr></tbody></table></div></main></div><script src="app.js"></script><script>(function(){const rows=document.querySelector('#outreachRows');let leads=JSON.parse(localStorage.getItem('yhtrade.leads')||'[]');const confirmedNames=['현지패션','URT(로뎀나무아래서)','남대문까운사','엔디엠(NDM)'];const today=new Date().toISOString().slice(0,10);leads.forEach(function(x){const tel=String(x.phone||'').replace(/\\s/g,'');if(String(x.date||'').slice(0,10)===today && /^010[-]?\\d{4}[-]?\\d{4}$/.test(tel) && !x.smsWritten && !x.smsNotNeeded){delete x.contactActivityConfirmed;delete x.lastContactAt;x.status='연락 대기';x.next='문자 발송'}});leads.forEach(function(x){if(confirmedNames.indexOf(x.name)>=0){x.mailWritten=true;x.smsNotNeeded=true;x.contactActivityConfirmed=true;if(!x.lastContactAt)x.lastContactAt=new Date().toISOString();if(!x.log)x.log='메일 작성 | 문자 불가 확인';}});localStorage.setItem('yhtrade.leads',JSON.stringify(leads));const contacted=leads.filter(function(x){return x.contactActivityConfirmed===true});function render(){document.querySelector('#outreachSummary').textContent='('+contacted.length+'곳 / 전체 '+new Set(leads.map(function(x){return String(x.name||'').split(' — ')[0].trim()})).size+'곳)';if(!contacted.length){rows.innerHTML='<tr><td colspan="5" class="muted">아직 연락을 완료한 고객이 없습니다.</td></tr>';return}const q=(document.querySelector('#outreachSearch').value||'').trim().toLowerCase();const visible=contacted.filter(function(x){const text=[x.name,x.interest,x.log,x.responseStatus].join(' ').toLowerCase();return !q||text.indexOf(q)>=0});rows.innerHTML=visible.sort(function(a,b){return String(b.lastContactAt).localeCompare(String(a.lastContactAt))}).map(function(x,i){const d=new Date(x.lastContactAt).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});const m=(x.log||'').split(' | ').pop().replace(' 작성','')||'연락';const status=x.responseStatus||'답변 대기';return '<tr><td><span class="seq">'+(i+1)+'</span><b>'+String(x.name||'')+'</b><br><span class="muted">'+String(x.interest||'')+'</span></td><td>'+d+'</td><td>'+m+'</td><td><span class="badge">'+status+'</span><br><button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="메일 회신">메일 회신</button> <button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="문자 회신">문자 회신</button> <button class="btn response-btn" data-name="'+String(x.name||'')+'" data-status="전화 응답">전화 응답</button></td><td>후속 확인</td></tr>'}).join('');document.querySelectorAll('.response-btn').forEach(function(b){b.onclick=function(){const lead=leads.find(function(x){return x.name===b.dataset.name});if(lead){lead.responseStatus=b.dataset.status;lead.responseAt=new Date().toISOString();localStorage.setItem('yhtrade.leads',JSON.stringify(leads));location.reload()}}})}document.querySelector('#outreachSearch').oninput=render;async function syncOutlookReplies(){try{const r=await fetch('http://127.0.0.1:8766/replies',{cache:'no-store'});if(!r.ok)return;const data=await r.json();let changed=false;(data.replies||[]).forEach(function(reply){const sender=String(reply.sender||'').toLowerCase();const lead=leads.find(function(x){return sender&&String(x.email||'').toLowerCase()===sender});if(lead&&lead.responseStatus!=='메일 회신'){lead.responseStatus='메일 회신';lead.responseAt=reply.received;changed=true}});if(changed){localStorage.setItem('yhtrade.leads',JSON.stringify(leads));render()}}catch(e){}}syncOutlookReplies();setInterval(syncOutlookReplies,300000);render()})();</script></body></html>
